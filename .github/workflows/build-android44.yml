name: Build Android 4.4 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install legacy Android SDK packages
        run: sdkmanager --install "platforms;android-22" "build-tools;22.0.1"

      - name: Install Gradle 2.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.2.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidDLNA-Android44-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
